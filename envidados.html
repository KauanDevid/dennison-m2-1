    <h1>Formulario de Envio de Dados</h1>

    <div id="arquivo">
        <p>
            <fieldset>
                <form action="index.html" method="post">
                    <legend>Envio de Arquivo</legend>
                    <input type="file" name="anexar" id="anexar"><br>
                    <input type="submit" value="enviar">
                </form>
            </fieldset>
        </p>
    </div>
    <div id="pesquisa" > 
        <p>
            <fieldset>
                <form action="formulario.html" method="post">
                    <legend>Google</legend>
                    <input type="search" name="buscar" id="buscar"><br>
                    <input type="submit" value="Go">
                </form>
            </fieldset>
        </p>
    </div>
    <div id="urlsites">
        <p>
            <fieldset>
                <form action="formulario.html" method="post">
                    <legend>URL</legend>
                    <input type="url" name="url" id="url" placeholder="http://exemplo.com"><br>
                    <input type="submit" value="Enviar">
                </form>
            </fieldset>
        </p>
    </div>
    <div id="assinatura">
        <p>
            <fieldset>
                <form action="formulario.html" method="post">
                    <legend>Assine Nosso Canal</legend><br>
                    <label for="email">Digite seu email <br><input type="email" name="email" id="email"/></label><br>
                    <input type="image" src="logo.png" alt="logo teste" width="150px">
                </form>
            </fieldset>
        </p>
    </div>
    <div id="video/audio">

            <video src="audio/video/videoplayback.mp4" controls loop></video>
